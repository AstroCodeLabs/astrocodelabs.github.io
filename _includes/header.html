<!-- header -->
{% assign header_icon = page.app_icon | default: site.app_icon %}
{% assign header_name = page.app_name | default: site.app_name %}

<header>
  <div class="logo">
    <!-- Home link with inline SVG icon -->
    <a href="{{ '/' | relative_url }}" target="_self" class="headerHomeLink">
      <svg class="navIcon" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7"></path>
        <path d="M9 22V12h6v10"></path>
      </svg>
      <span>Home</span>
    </a>
  </div>

  <nav class="scroll">
    <ul>
      <li>
        <!-- Support link with inline question-circle icon -->
        <a href="{{ '/support/' | relative_url }}" target="_self" class="headerSupportLink">
          <svg class="navIcon" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 2"></path>
            <line x1="12" y1="17" x2="12" y2="17"></line>
          </svg>
          <span>Support</span>
        </a>
      </li>
    </ul>
  </nav>
</header>
